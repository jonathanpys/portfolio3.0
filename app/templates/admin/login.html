{% extends "admin/base.html" %}

{% block title %}Login Admin{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Admin<span class="text-accent">Panel</span></h2>
            <p class="text-muted small">Masuk untuk mengelola portofolio</p>
        </div>
        <div class="card border-0 p-2">
            <div class="card-body p-4">
                <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-4">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Masukkan username" required>
                        </div>
                    </div>
                    <div class="mb-5">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                            <button class="btn border-0 text-muted shadow-none rounded-0 px-2 toggle-btn-material" type="button" id="togglePassword" style="border-bottom: 2px solid rgba(255,255,255,0.1) !important; transition: all 0.3s;">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                        <span id="loginBtnText">Log In</span>
                        <div id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                    <div class="text-center mt-4">
                        <a href="/" class="text-muted text-decoration-none small hover-lime"><i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Halaman Utama</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("togglePassword").addEventListener("click", function () {
    const passwordInput = document.getElementById("password");
    const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
    passwordInput.setAttribute("type", type);
    this.innerHTML = type === "password" ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
});

document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    
    const form = e.target;
    const alertBox = document.getElementById("loginAlert");
    const btnText = document.getElementById("loginBtnText");
    const spinner = document.getElementById("loginSpinner");
    
    // Hide alert
    alertBox.classList.add("d-none");
    
    // Show spinner
    btnText.classList.add("d-none");
    spinner.classList.remove("d-none");
    form.querySelector("button").disabled = true;
    
    const data = {
        username: form.username.value,
        password: form.password.value
    };
    
    try {
        const res = await fetch("{{ url_for('admin.login') }}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });
        
        const result = await res.json();
        
        if (res.ok && result.status === "success") {
            window.location.href = "{{ url_for('admin.dashboard') }}";
        } else {
            alertBox.textContent = result.message || "Gagal login. Periksa kembali username/password.";
            alertBox.classList.remove("d-none");
        }
    } catch (err) {
        alertBox.textContent = "Terjadi kesalahan jaringan.";
        alertBox.classList.remove("d-none");
    } finally {
        // Hide spinner
        btnText.classList.remove("d-none");
        spinner.classList.add("d-none");
        form.querySelector("button").disabled = false;
    }
});
</script>
{% endblock %}

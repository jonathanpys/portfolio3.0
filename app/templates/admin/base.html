<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %} - Portfolio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='frontend/img/logo.png') }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/style.css') }}?v=1.6">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="glow-effect"></div>

    <!-- Navbar -->
    {% if current_user.is_authenticated %}
    <nav class="navbar navbar-expand-lg navbar-dark mb-5 sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('admin.dashboard') }}">Admin<span>Panel</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{{ url_for('admin.dashboard') }}">Dashboard</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="navbar-text me-4 text-muted small">
                        <i class="fa-solid fa-user text-accent me-2"></i>{{ current_user.username }}
                    </span>
                    <button class="btn btn-primary btn-sm" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <!-- Main Content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS Auth -->
    {% if current_user.is_authenticated %}
    <script>
        async function logout() {
            try {
                const res = await fetch("{{ url_for('admin.logout') }}", { method: "POST" });
                if (res.ok) {
                    window.location.href = "{{ url_for('admin.login') }}";
                }
            } catch (err) {
                console.error("Logout error", err);
            }
        }
    </script>
    {% endif %}

    {% block scripts %}{% endblock %}
</body>
</html>

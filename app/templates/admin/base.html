<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %} - Portfolio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='frontend/img/logo.png') }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/style.css') }}?v=1.6">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="glow-effect"></div>

    <!-- Navbar -->
    {% if current_user.is_authenticated %}
    <nav class="navbar navbar-dark mb-5 sticky-top" style="background-color: rgba(11, 15, 25, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color);">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand m-0" href="{{ url_for('admin.dashboard') }}">Admin<span>Panel</span></a>
            
            <div class="d-flex align-items-center gap-2 gap-sm-3">
                <span class="navbar-text text-white small m-0" style="font-size: 0.85rem;">
                    <i class="fa-solid fa-user text-accent me-2"></i>{{ current_user.username }}
                </span>
                <button class="btn btn-primary btn-sm d-flex align-items-center" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket me-2"></i>Logout
                </button>
            </div>
        </div>
    </nav>
    {% endif %}

    <!-- Main Content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS Auth -->
    {% if current_user.is_authenticated %}
    <script>
        async function logout() {
            try {
                const res = await fetch("{{ url_for('admin.logout') }}", { method: "POST" });
                if (res.ok) {
                    window.location.href = "{{ url_for('admin.login') }}";
                }
            } catch (err) {
                console.error("Logout error", err);
            }
        }
    </script>
    {% endif %}

    {% block scripts %}{% endblock %}
</body>
</html>
